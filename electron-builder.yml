appId: com.chatmode.desktop
productName: Chat Mode
copyright: Copyright © 2026
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - "!src/**"
  - "!tests/**"
  - "!scripts/**"
  - "!docs/**"
  - "!proxy/**"
  - "!**/*.map"
  - "!**/*.md"
  - "!{.env,.env.example,tsconfig.json,vitest.config.ts,electron.vite.config.ts}"
  - "!resources/brain/**"
  - "!node_modules/tesseract.js-core/tesseract-core.js"
  - "!node_modules/tesseract.js-core/tesseract-core.wasm"
  - "!node_modules/tesseract.js-core/tesseract-core.wasm.js"
  - "!node_modules/tesseract.js-core/tesseract-core-simd.js"
  - "!node_modules/tesseract.js-core/tesseract-core-simd.wasm"
  - "!node_modules/tesseract.js-core/tesseract-core-simd.wasm.js"
extraResources:
  - from: resources/whisper
    to: whisper
    filter:
      - "**/*"
      - "!**/.gitkeep"
  - from: resources/icons
    to: icons
  - from: resources/brain
    to: brain
    filter:
      - "**/*"
      - "!**/.gitkeep"
      - "!**/*.partial"
      - "!**/*.gguf"
asarUnpack:
  - "**/*.node"
  - "**/node_modules/uiohook-napi/**"
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
  - "**/node_modules/bmp-js/**"
  - "**/node_modules/idb-keyval/**"
  - "**/node_modules/is-electron/**"
  - "**/node_modules/is-url/**"
  - "**/node_modules/node-fetch/**"
  - "**/node_modules/opencollective-postinstall/**"
  - "**/node_modules/regenerator-runtime/**"
  - "**/node_modules/wasm-feature-detect/**"
  - "**/node_modules/zlibjs/**"
  - "**/node_modules/whatwg-url/**"
  - "**/node_modules/tr46/**"
  - "**/node_modules/webidl-conversions/**"
win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ChatMode-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Chat Mode
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
portable:
  artifactName: ChatMode-${version}-portable.${ext}
