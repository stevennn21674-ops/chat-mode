<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Mode</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="panel">
      <div id="hype" class="hype hidden" aria-hidden="true">
        <span id="hype-label">Hype train</span>
        <span class="track"><span id="hype-fill"></span></span>
      </div>
      <div id="alert" class="alert hidden" aria-live="polite">
        <p id="alert-kicker"></p>
        <p id="alert-main"></p>
        <p id="alert-text"></p>
      </div>
      <div class="topbar">
        <span id="viewers" class="viewers" aria-label="Viewers">
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true">
            <path fill="currentColor" d="M10 4.5C6.1 4.5 2.7 6.8 1.2 10c1.5 3.2 4.9 5.5 8.8 5.5s7.3-2.3 8.8-5.5C17.3 6.8 13.9 4.5 10 4.5zm0 9.2a3.7 3.7 0 1 1 0-7.4 3.7 3.7 0 0 1 0 7.4zm0-1.6a2.1 2.1 0 1 0 0-4.2 2.1 2.1 0 0 0 0 4.2z"/>
          </svg>
          <span id="viewer-count">0</span>
        </span>
        <div class="status" aria-live="polite">
          <span id="paused" class="pill warn hidden">Capture paused</span>
          <span id="speed" class="pill speed">speed 4</span>
        </div>
      </div>
      <div id="log" class="log"><div class="spacer"></div></div>
      <p id="debug" class="debug hidden"></p>
      <div class="footer">
        <span id="mic" class="mic hidden"><i></i><span id="mic-label">Mic live</span></span>
        <button id="resize" type="button" aria-label="Resize chat"></button>
      </div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
