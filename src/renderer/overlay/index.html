<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Mode</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="panel">
      <div id="hype" class="hype hidden" aria-hidden="true">
        <span id="hype-label">Hype train</span>
        <span class="track"><span id="hype-fill"></span></span>
      </div>
      <div class="status" aria-live="polite">
        <span id="analyzing" class="pill hidden"><i></i>Screen is being analyzed</span>
        <span id="paused" class="pill warn hidden">Capture paused</span>
        <span id="speed" class="pill speed hidden"></span>
      </div>
      <div id="log" class="log"><div class="spacer"></div></div>
      <div class="footer">
        <span id="mic" class="mic hidden"><i></i><span id="mic-label">Mic live</span></span>
        <button id="resize" type="button" aria-label="Resize chat"></button>
      </div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
