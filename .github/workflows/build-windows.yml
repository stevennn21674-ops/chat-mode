name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Optional. When set, the build seals this key as a fallback. The app
      # still builds and runs when the secret is missing; users enter a key
      # in Settings, where it is encrypted with Windows DPAPI.
      AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Cache the speech model and binary
        uses: actions/cache@v4
        with:
          path: resources/whisper
          key: whisper-b5454-tiny-en-${{ runner.os }}-x64

      - name: Install
        run: npm ci

      - name: Download the on-device speech model
        run: node scripts/fetch-whisper.mjs

      - name: Cache the local brain
        uses: actions/cache@v4
        with:
          path: resources/brain
          key: brain-qwen25-0.5b-q8-ca59ca7f-llama-b12032-${{ runner.os }}-x64

      - name: Download the bundled local model
        run: node scripts/fetch-brain.mjs

      - name: Test
        run: npm test

      - name: Build installer and portable app
        # dist:win passes --publish never once. A repeated flag is parsed as an
        # array, which electron-builder 26 does not treat as never.
        run: npm run dist:win

      - name: Zip the portable app
        shell: pwsh
        run: |
          $exes = @(Get-ChildItem -Path release -Filter "*.exe")
          $portable = $exes | Where-Object { $_.Name -like "*portable*" } | Select-Object -First 1
          $setup = $exes | Where-Object { $_.Name -notlike "*portable*" } | Select-Object -First 1
          if (-not $portable) { throw "Portable exe was not produced" }
          if (-not $setup) { throw "NSIS installer was not produced" }
          $limit = 1800MB
          Write-Host "Installer: $($setup.Name) $($setup.Length) bytes"
          Write-Host "Portable: $($portable.Name) $($portable.Length) bytes"
          if ($portable.Length -gt $limit) {
            Write-Host "Portable exe is over 1.8 GB, so the zip asset is skipped."
          } else {
            Compress-Archive -Path $portable.FullName -DestinationPath "release/ChatMode-portable.zip" -Force
            $zip = Get-Item "release/ChatMode-portable.zip"
            Write-Host "Zip: $($zip.Name) $($zip.Length) bytes"
            if ($zip.Length -gt $limit) {
              Remove-Item $zip.FullName -Force
              Write-Host "Zip was over 1.8 GB, so it was dropped."
            }
          }

      - name: Upload installer and portable zip
        uses: actions/upload-artifact@v4
        with:
          name: chat-mode-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.zip

      - name: Attach builds to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
